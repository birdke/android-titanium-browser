name: Build Titanium x86_64

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Local compile jobs (2-4)
        required: true
        type: choice
        default: '4'
        options:
          - '2'
          - '3'
          - '4'
      resume_only:
        description: Skip warmups and resume the final job from the newest cache
        required: true
        type: boolean
        default: false
      build_time_limit:
        description: Ninja time limit for each build stage
        required: true
        type: choice
        default: 300m
        options:
          - 300m
          - 325m

permissions:
  contents: write

# Standard GitHub-hosted jobs have a hard six-hour limit. Seed a shared ccache
# in bounded jobs, then perform the final link/package job from the warm cache.
jobs:
  warm-cache-1:
    name: Warm compiler cache 1/4
    if: ${{ !inputs.resume_only }}
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      build_time_limit: ${{ inputs.build_time_limit }}
      stage_name: warm-1
      warmup: true
    secrets: inherit

  warm-cache-2:
    name: Warm compiler cache 2/4
    needs: warm-cache-1
    if: ${{ needs.warm-cache-1.outputs.apk_ready != 'true' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      build_time_limit: ${{ inputs.build_time_limit }}
      stage_name: warm-2
      warmup: true
    secrets: inherit

  warm-cache-3:
    name: Warm compiler cache 3/4
    needs: warm-cache-2
    if: ${{ needs.warm-cache-2.outputs.apk_ready != 'true' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      build_time_limit: ${{ inputs.build_time_limit }}
      stage_name: warm-3
      warmup: true
    secrets: inherit

  warm-cache-4:
    name: Warm compiler cache 4/4
    needs: warm-cache-3
    if: ${{ needs.warm-cache-3.outputs.apk_ready != 'true' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      build_time_limit: ${{ inputs.build_time_limit }}
      stage_name: warm-4
      warmup: true
    secrets: inherit

  build-x86_64:
    name: Build and sign x86_64 APK
    needs: [warm-cache-1, warm-cache-2, warm-cache-3, warm-cache-4]
    if: >-
      ${{
        always() &&
        needs.warm-cache-1.result != 'failure' &&
        needs.warm-cache-1.result != 'cancelled' &&
        needs.warm-cache-2.result != 'failure' &&
        needs.warm-cache-2.result != 'cancelled' &&
        needs.warm-cache-3.result != 'failure' &&
        needs.warm-cache-3.result != 'cancelled' &&
        needs.warm-cache-4.result != 'failure' &&
        needs.warm-cache-4.result != 'cancelled' &&
        needs.warm-cache-1.outputs.apk_ready != 'true' &&
        needs.warm-cache-2.outputs.apk_ready != 'true' &&
        needs.warm-cache-3.outputs.apk_ready != 'true' &&
        needs.warm-cache-4.outputs.apk_ready != 'true'
      }}
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      build_time_limit: ${{ inputs.build_time_limit }}
      stage_name: final
      warmup: false
    secrets: inherit
