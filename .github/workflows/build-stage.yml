name: Titanium x86_64 build stage

on:
  workflow_call:
    inputs:
      build_jobs:
        required: true
        type: string
      build_time_limit:
        required: true
        type: string
      stage_name:
        required: true
        type: string
      warmup:
        required: true
        type: boolean
    secrets:
      LOCAL_TEST_JKS:
        required: true
      STORE_TEST_JKS:
        required: true
    outputs:
      apk_ready:
        description: Whether this stage produced a signed x86_64 APK
        value: ${{ jobs.stage.outputs.apk_ready }}

permissions:
  contents: write

jobs:
  stage:
    name: ${{ inputs.stage_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      apk_ready: ${{ steps.apk-status.outputs.apk_ready }}
    steps:
      - name: Set build deadline
        shell: bash
        run: |
          # Include runner setup in the budget and leave 30 minutes for checkpoints.
          echo "TITANIUM_JOB_BUILD_DEADLINE=$(( $(date +%s) + 330 * 60 ))" >> "$GITHUB_ENV"

      - name: Reclaim preinstalled runner space
        uses: endersonmenezes/free-disk-space@cc5a57aa862b7769888199b7e4e012b0c8440b92 # v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable chromedriver google-cloud-sdk firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-* gfortran* mongodb-* mono-* monodoc-* unixodbc-dev ant* apache2* nginx php* r-base* ruby*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia* /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle* /usr/local/bin/azcopy /usr/share/kotlinc /usr/share/apache-maven-* /usr/local/share/gecko_driver"

      - name: Prepare workspace for the runner disk layout
        shell: bash
        run: |
          set -euo pipefail
          sudo docker system prune --all --force --volumes
          sudo apt-get update
          sudo apt-get install -y git lvm2

          gib=$((1024 * 1024 * 1024))
          root_device=$(stat -c %d /var/tmp)
          mnt_device=$(stat -c %d /mnt)
          findmnt -T /var/tmp
          findmnt -T /mnt
          if [[ "$root_device" == "$mnt_device" ]]; then
            # Newer runners keep /mnt on the root filesystem. Use its real capacity.
            echo "/var/tmp and /mnt share a filesystem; keeping the native workspace."
            swap_file=/mnt/titanium.swap
            swap_size=8G
            reserve_bytes=$((8 * gib))
          else
            root_free=$(df --output=avail -B1 /var/tmp | tail -1 | tr -d ' ')
            mnt_free=$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')
            root_image=$((root_free - 8 * gib))
            mnt_image=$((mnt_free - 1 * gib))
            if (( root_image < gib || mnt_image < gib )); then
              echo "Not enough space to create the build volume" >&2
              df -hT
              exit 10
            fi

            # Allocate backing blocks now, rather than advertising sparse capacity.
            sudo fallocate -l "$root_image" /var/tmp/titanium-root.img
            sudo fallocate -l "$mnt_image" /mnt/titanium-mnt.img
            root_loop=$(sudo losetup -f --show /var/tmp/titanium-root.img)
            mnt_loop=$(sudo losetup -f --show /mnt/titanium-mnt.img)
            sudo pvcreate "$root_loop" "$mnt_loop"
            sudo vgcreate titanium-build-vg "$root_loop" "$mnt_loop"
            sudo lvcreate -n workspace -l 100%FREE titanium-build-vg
            sudo mkfs.ext4 -F -m 0 -E nodiscard /dev/titanium-build-vg/workspace

            sudo mkdir -p /mnt/titanium-build-volume
            sudo mount /dev/titanium-build-vg/workspace /mnt/titanium-build-volume
            sudo mkdir -p /mnt/titanium-build-volume/workspace "$GITHUB_WORKSPACE"
            sudo chown -R "$USER:$(id -gn)" /mnt/titanium-build-volume/workspace
            sudo mount --bind /mnt/titanium-build-volume/workspace "$GITHUB_WORKSPACE"
            swap_file=/mnt/titanium-build-volume/titanium.swap
            swap_size=24G
            reserve_bytes=0
          fi

          sudo fallocate -l "$swap_size" "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          sudo sysctl -w vm.swappiness=80

          mapfile -t runner_pids < <(pgrep -f 'Runner\.(Listener|Worker)' || true)
          for runner_pid in "${runner_pids[@]}"; do
            if sudo test -e "/proc/$runner_pid/oom_score_adj"; then
              echo -1000 | sudo tee "/proc/$runner_pid/oom_score_adj" >/dev/null || true
            fi
          done
          echo "Protected runner PIDs: ${runner_pids[*]:-none}"

          available_bytes=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')
          if (( available_bytes < 108 * gib + reserve_bytes )); then
            echo "Workspace needs 108 GiB plus the filesystem reserve after swap allocation." >&2
            df -hT
            exit 11
          fi
          df -hT
          swapon --show

      - name: Checkout Titanium source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ github.workspace }}/.ccache
          key: titanium-ccache-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage_name }}
          restore-keys: |
            titanium-ccache-v1-${{ runner.os }}-${{ github.sha }}-
            titanium-ccache-v1-${{ runner.os }}-

      - name: Build signed x86_64 APK
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 9G
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
          TITANIUM_ALLOW_INCOMPLETE_BUILD: '1'
          TITANIUM_BUILD_CACHE_DIR: ${{ github.workspace }}/.build-cache
          TITANIUM_BUILD_JOBS: ${{ inputs.build_jobs }}
          TITANIUM_BUILD_TIME_LIMIT: ${{ inputs.build_time_limit }}
          TITANIUM_STAGE_NAME: ${{ inputs.stage_name }}
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          echo 250 | sudo tee "/proc/$$/oom_score_adj" >/dev/null

          diagnostics_dir="$RUNNER_TEMP/titanium-diagnostics"
          mkdir -p "$diagnostics_dir" || true
          resource_snapshot() {
            echo "::group::Resource snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            free -h || true
            swapon --show || true
            df -hT / /mnt "$GITHUB_WORKSPACE" || true
            df -i / /mnt "$GITHUB_WORKSPACE" || true
            for resource in cpu memory io; do
              echo "Pressure: $resource"
              cat "/proc/pressure/$resource" || true
            done
            ps -eo pid,ppid,ni,%cpu,%mem,rss,comm --sort=-rss | head -n 12 || true
            sudo dmesg --ctime --since '2 minutes ago' || true
            echo "::endgroup::"
          }
          monitor_resources() {
            while true; do
              resource_snapshot 2>&1 | tee -a "$diagnostics_dir/resources.log" ||
                echo "::warning::Could not persist a resource snapshot; continuing console diagnostics."
              sleep 60
            done
          }
          monitor_resources &
          resource_monitor_pid=$!
          cleanup_monitor() {
            build_status=$?
            trap - EXIT
            kill "$resource_monitor_pid" 2>/dev/null || true
            wait "$resource_monitor_pid" 2>/dev/null || true
            echo "Build shell exit status: $build_status" | tee -a "$diagnostics_dir/resources.log" || true
            resource_snapshot 2>&1 | tee -a "$diagnostics_dir/resources.log" || true
            exit "$build_status"
          }
          trap cleanup_monitor EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT

          remaining_seconds=$((TITANIUM_JOB_BUILD_DEADLINE - $(date +%s)))
          if (( remaining_seconds <= 0 )); then
            echo "Runner setup exhausted the build budget before the build script started." >&2
            exit 1
          fi
          if [[ ! "$TITANIUM_BUILD_TIME_LIMIT" =~ ^([1-9][0-9]*)m$ ]]; then
            echo "Build-script time limit must be a positive integer number of minutes." >&2
            exit 2
          fi
          requested_seconds=$((10#${BASH_REMATCH[1]} * 60))
          if (( remaining_seconds > requested_seconds )); then
            remaining_seconds=$requested_seconds
          fi
          echo "Build script has ${remaining_seconds}s left before the checkpoint deadline."
          chmod +x ./*.sh
          set +e
          # Use one timeout process group for source preparation and compilation.
          timeout --signal=TERM --kill-after=120s "${remaining_seconds}s" \
            env -u TITANIUM_BUILD_TIME_LIMIT nice -n 5 ./build-x86_64.sh
          build_status=$?
          set -e
          if (( build_status == 124 )); then
            echo "The whole-job build budget was reached; saving the compiler cache checkpoint."
            if command -v ccache >/dev/null 2>&1; then
              ccache --cleanup
              ccache --show-stats --verbose
            fi
          elif (( build_status != 0 )); then
            exit "$build_status"
          fi

      - name: Collect final runner diagnostics
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/titanium-diagnostics" || true
          {
            date -u
            df -hT || true
            df -i || true
            free -h || true
            swapon --show || true
            findmnt -T /var/tmp || true
            findmnt -T /mnt || true
            sudo losetup --list || true
            sudo dmesg --ctime | tail -n 300 || true
          } 2>&1 | tee "$RUNNER_TEMP/titanium-diagnostics/final.log" ||
            echo "::warning::Could not persist final diagnostics; see the console output."

      - name: Upload runner diagnostics
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titanium-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage_name }}
          path: ${{ runner.temp }}/titanium-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Detect signed APK
        id: apk-status
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(chromium/src/out/release/*-x86_64.apk)
          hashes=(chromium/src/out/release/*-x86_64.apk.sha256)
          if (( ${#apks[@]} == 1 && ${#hashes[@]} == 1 )); then
            echo "apk_ready=true" >> "$GITHUB_OUTPUT"
            echo "Signed APK is ready for upload."
          else
            echo "apk_ready=false" >> "$GITHUB_OUTPUT"
            echo "No signed APK yet; this stage produced a compiler-cache checkpoint."
          fi

      - name: Upload signed APK
        if: ${{ steps.apk-status.outputs.apk_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titanium-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage_name }}-x86_64
          path: |
            chromium/src/out/release/*-x86_64.apk
            chromium/src/out/release/*-x86_64.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish GitHub Release
        if: ${{ steps.apk-status.outputs.apk_ready == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          tag="v${version}-x86_64"
          assets=(
            chromium/src/out/release/*-x86_64.apk
            chromium/src/out/release/*-x86_64.apk.sha256
          )
          if (( ${#assets[@]} != 2 )); then
            echo "Expected the signed APK and its SHA256 file" >&2
            exit 6
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Titanium ${version} x86_64" \
              --notes "Unofficial x86_64 Android build produced by GitHub Actions run ${GITHUB_RUN_ID}."
          fi

      - name: Save compiler cache checkpoint
        if: ${{ steps.apk-status.outputs.apk_ready != 'true' }}
        uses: actions/cache/save@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ github.workspace }}/.ccache
          key: titanium-ccache-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage_name }}

      - name: Mark incomplete final stage for retry
        if: ${{ !inputs.warmup && steps.apk-status.outputs.apk_ready != 'true' }}
        shell: bash
        run: |
          echo "The final stage reached its planned time limit before producing an APK." >&2
          echo "Its compiler cache was saved; rerun failed jobs to continue from that checkpoint." >&2
          exit 1
