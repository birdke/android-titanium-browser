name: Build Titanium x86_64

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Local compile jobs (2-4)
        required: true
        type: choice
        default: '4'
        options:
          - '2'
          - '3'
          - '4'

permissions:
  contents: read

# Standard GitHub-hosted jobs have a hard six-hour limit. Seed a shared ccache
# in bounded jobs, then perform the final link/package job from the warm cache.
jobs:
  warm-cache-1:
    name: Warm compiler cache 1/4
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      stage_name: warm-1
      warmup: true
    secrets: inherit

  warm-cache-2:
    name: Warm compiler cache 2/4
    needs: warm-cache-1
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      stage_name: warm-2
      warmup: true
    secrets: inherit

  warm-cache-3:
    name: Warm compiler cache 3/4
    needs: warm-cache-2
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      stage_name: warm-3
      warmup: true
    secrets: inherit

  warm-cache-4:
    name: Warm compiler cache 4/4
    needs: warm-cache-3
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      stage_name: warm-4
      warmup: true
    secrets: inherit

  build-x86_64:
    name: Build and sign x86_64 APK
    needs: warm-cache-4
    uses: ./.github/workflows/build-stage.yml
    with:
      build_jobs: ${{ inputs.build_jobs }}
      stage_name: final
      warmup: false
    secrets: inherit
