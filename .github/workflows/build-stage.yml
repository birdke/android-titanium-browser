name: Titanium x86_64 build stage

on:
  workflow_call:
    inputs:
      build_jobs:
        required: true
        type: string
      stage_name:
        required: true
        type: string
      warmup:
        required: true
        type: boolean
    secrets:
      LOCAL_TEST_JKS:
        required: true
      STORE_TEST_JKS:
        required: true
    outputs:
      apk_ready:
        description: Whether this stage produced a signed x86_64 APK
        value: ${{ jobs.stage.outputs.apk_ready }}

permissions:
  contents: read

jobs:
  stage:
    name: ${{ inputs.stage_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      apk_ready: ${{ steps.apk-status.outputs.apk_ready }}
    steps:
      - name: Reclaim preinstalled runner space
        uses: endersonmenezes/free-disk-space@cc5a57aa862b7769888199b7e4e012b0c8440b92 # v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable chromedriver google-cloud-sdk firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-* gfortran* mongodb-* mono-* monodoc-* unixodbc-dev ant* apache2* nginx php* r-base* ruby*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia* /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle* /usr/local/bin/azcopy /usr/share/kotlinc /usr/share/apache-maven-* /usr/local/share/gecko_driver"

      - name: Combine root and /mnt free space
        shell: bash
        run: |
          set -euo pipefail
          sudo docker system prune --all --force --volumes
          sudo apt-get update
          sudo apt-get install -y git lvm2

          gib=$((1024 * 1024 * 1024))
          root_free=$(df --output=avail -B1 / | tail -1 | tr -d ' ')
          mnt_free=$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')
          root_image=$((root_free - 8 * gib))
          mnt_image=$((mnt_free - 1 * gib))
          if (( root_image < gib || mnt_image < gib )); then
            echo "Not enough space to create the build volume" >&2
            df -hT
            exit 10
          fi

          sudo truncate -s "$root_image" /var/tmp/titanium-root.img
          sudo truncate -s "$mnt_image" /mnt/titanium-mnt.img
          root_loop=$(sudo losetup -f --show /var/tmp/titanium-root.img)
          mnt_loop=$(sudo losetup -f --show /mnt/titanium-mnt.img)
          sudo pvcreate "$root_loop" "$mnt_loop"
          sudo vgcreate titanium-build-vg "$root_loop" "$mnt_loop"
          sudo lvcreate -n workspace -l 100%FREE titanium-build-vg
          sudo mkfs.ext4 -F -m 0 /dev/titanium-build-vg/workspace

          sudo mkdir -p /mnt/titanium-build-volume
          sudo mount /dev/titanium-build-vg/workspace /mnt/titanium-build-volume
          sudo mkdir -p /mnt/titanium-build-volume/workspace "$GITHUB_WORKSPACE"
          sudo chown -R "$USER:$(id -gn)" /mnt/titanium-build-volume/workspace
          sudo mount --bind /mnt/titanium-build-volume/workspace "$GITHUB_WORKSPACE"

          sudo fallocate -l 24G /mnt/titanium-build-volume/titanium.swap
          sudo chmod 600 /mnt/titanium-build-volume/titanium.swap
          sudo mkswap /mnt/titanium-build-volume/titanium.swap
          sudo swapon /mnt/titanium-build-volume/titanium.swap
          sudo sysctl -w vm.swappiness=80

          mapfile -t runner_pids < <(pgrep -f 'Runner\.(Listener|Worker)' || true)
          for runner_pid in "${runner_pids[@]}"; do
            if sudo test -e "/proc/$runner_pid/oom_score_adj"; then
              echo -1000 | sudo tee "/proc/$runner_pid/oom_score_adj" >/dev/null || true
            fi
          done
          echo "Protected runner PIDs: ${runner_pids[*]:-none}"

          available_gib=$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')
          if (( available_gib < 108 )); then
            echo "Expanded workspace has only ${available_gib} GiB available" >&2
            df -hT
            exit 11
          fi
          df -hT
          swapon --show

      - name: Checkout Titanium source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ github.workspace }}/.ccache
          key: titanium-ccache-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage_name }}
          restore-keys: |
            titanium-ccache-v1-${{ runner.os }}-${{ github.sha }}-
            titanium-ccache-v1-${{ runner.os }}-

      - name: Build signed x86_64 APK
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
          TITANIUM_ALLOW_INCOMPLETE_BUILD: '1'
          TITANIUM_BUILD_CACHE_DIR: ${{ github.workspace }}/.build-cache
          TITANIUM_BUILD_JOBS: ${{ inputs.build_jobs }}
          TITANIUM_BUILD_TIME_LIMIT: 300m
          TITANIUM_STAGE_NAME: ${{ inputs.stage_name }}
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          echo 250 | sudo tee "/proc/$$/oom_score_adj" >/dev/null

          monitor_resources() {
            while true; do
              echo "::group::Resource snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              free -h
              swapon --show
              df -h "$GITHUB_WORKSPACE"
              ps -eo pid,ppid,ni,%cpu,%mem,rss,comm --sort=-rss | head -n 12 || true
              echo "::endgroup::"
              sleep 300
            done
          }
          monitor_resources &
          resource_monitor_pid=$!
          cleanup_monitor() {
            kill "$resource_monitor_pid" 2>/dev/null || true
            wait "$resource_monitor_pid" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT

          chmod +x ./*.sh
          nice -n 5 ./build-x86_64.sh

      - name: Detect signed APK
        id: apk-status
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(chromium/src/out/release/*-x86_64.apk)
          hashes=(chromium/src/out/release/*-x86_64.apk.sha256)
          if (( ${#apks[@]} == 1 && ${#hashes[@]} == 1 )); then
            echo "apk_ready=true" >> "$GITHUB_OUTPUT"
            echo "Signed APK is ready for upload."
          else
            echo "apk_ready=false" >> "$GITHUB_OUTPUT"
            echo "No signed APK yet; this stage produced a compiler-cache checkpoint."
          fi

      - name: Upload signed APK
        if: ${{ steps.apk-status.outputs.apk_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titanium-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage_name }}-x86_64
          path: |
            chromium/src/out/release/*-x86_64.apk
            chromium/src/out/release/*-x86_64.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Save compiler cache checkpoint
        if: ${{ steps.apk-status.outputs.apk_ready != 'true' }}
        uses: actions/cache/save@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ${{ github.workspace }}/.ccache
          key: titanium-ccache-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage_name }}

      - name: Mark incomplete final stage for retry
        if: ${{ !inputs.warmup && steps.apk-status.outputs.apk_ready != 'true' }}
        shell: bash
        run: |
          echo "The final stage reached its planned time limit before producing an APK." >&2
          echo "Its compiler cache was saved; rerun failed jobs to continue from that checkpoint." >&2
          exit 1
